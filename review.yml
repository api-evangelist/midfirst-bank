actions:
  openapiHarvested: false
  reason: |
    No first-party public API and no publicly downloadable OpenAPI/Swagger exist
    for MidFirst Bank. The honest, non-fabricated result is an identity-only
    record with an aggregator-only open-finance posture (Open Access program);
    apis[] is empty and no spec was harvested.
