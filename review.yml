    authModel: >-
      Consumer-permissioned aggregator authentication (online-banking credentials
      plus one-time passcode and account-sharing consent) via the Open Access
      program. No documented first-party OAuth2/OIDC, API-key, or mTLS developer
      auth, because no first-party API is exposed.
    charterType: Federally chartered savings association (thrift)
  transports:
