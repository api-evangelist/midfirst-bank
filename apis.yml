name: MidFirst Bank
kind: company
description: >-
  MidFirst Bank is a federally chartered savings association (thrift) headquartered
  in Oklahoma City, Oklahoma, and owned by Midland Financial Co. Founded in 1982 with
  roots in Midland Mortgage from the early 1950s, it is the largest privately owned
  bank in the United States, with roughly $42 billion in assets and retail banking,
  private banking, commercial real estate lending, and nationwide mortgage servicing
  operations across Oklahoma, Arizona, California, Colorado, Nevada, Texas, and Utah.
  MidFirst does not operate a first-party public developer portal or publish
  downloadable OpenAPI/Swagger specifications. Its open-finance posture is
  aggregator-mediated: through its "Open Access" program, MidFirst adds direct API
  connections between its Business Online Banking platforms and consumer-permissioned
  data aggregators (Plaid, MX, Stripe, Intuit, Mastercard/Finicity, Envestnet Yodlee,
  and Morningstar), replacing screen scraping. There is no publicly documented
  first-party API surface, and no FDX participation or CFPB Section 1033 data-access
  posture is published on its site as of this review.
